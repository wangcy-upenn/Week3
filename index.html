<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --sign:#2A2D63; --screen:#000; --line:#23262B; --chip:#4A5058;
    --amber:#F2B233; --blue:#4C93F0; --red:#E33B3B;
    --eat:#F0A93C; --shop:#E07BB0; --see:#A874D8;
  }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{ background:#0A0A0B; color:#fff; font-family:"Barlow",system-ui,sans-serif;
        display:flex; justify-content:center; overflow:hidden;
        -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
  #unit{ width:100%; max-width:540px; height:100%; display:flex; flex-direction:column; background:var(--screen); }

  /* ---- sign + arrivals (unchanged from prototype A) ---- */
  .sign{ flex:0 0 auto; background:var(--sign); display:flex; align-items:center; gap:12px;
         padding:clamp(7px,1.3vh,12px) clamp(12px,3vw,20px); }
  .sign .bus{ flex:0 0 auto; width:26px; height:26px; }
  .sign .routes{ font-family:"Barlow Condensed",sans-serif; font-weight:700;
                 font-size:clamp(21px,3vh,29px); letter-spacing:.06em; line-height:1; }
  .sign .routes span{ color:#9FA3D8; margin:0 5px; font-weight:500; }
  .sign .id{ margin-left:auto; text-align:right; line-height:1.15; text-transform:uppercase;
             font-family:"Barlow Condensed",sans-serif; font-weight:500;
             font-size:clamp(9.5px,1.3vh,12px); letter-spacing:.11em; color:#B9BCE4; }
  .lv{ display:inline-block; font-weight:600; letter-spacing:.1em; color:#8E92C9; }
  .lv.on{ color:#7BE0A0; }
  .arrivals{ flex:0 0 auto; padding:clamp(3px,.7vh,8px) clamp(9px,2.4vw,14px) 0; }
  .row{ display:flex; align-items:center; gap:clamp(6px,1.6vw,11px); cursor:pointer; border-radius:6px;
        padding:clamp(3px,.8vh,8px) clamp(4px,1.4vw,8px); border-bottom:1px solid var(--line);
        transition:background .2s ease, opacity .2s ease; }
  .row:last-child{ border-bottom:0; }
  .row:hover{ background:rgba(255,255,255,.04); }
  .row.sel{ background:rgba(242,178,51,.14); box-shadow:inset 3px 0 0 var(--amber); }
  body.busy .row:not(.sel){ opacity:.45; }
  .chip{ flex:0 0 auto; min-width:clamp(34px,5vw,44px); text-align:center; padding:clamp(2px,.4vh,4px) 7px;
         border-radius:5px; background:var(--chip); font-family:"Barlow Condensed",sans-serif; font-weight:700;
         font-size:clamp(16px,2.2vh,21px); line-height:1.15; }
  .dest{ flex:1 1 auto; min-width:0; font-weight:600; font-size:clamp(13px,1.9vh,18px);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .delay{ flex:0 0 auto; display:none; background:var(--red); color:#fff; border-radius:999px;
          padding:clamp(1px,.35vh,4px) clamp(6px,1.5vw,10px); font-family:"Barlow Condensed",sans-serif;
          font-weight:700; line-height:1.15; font-size:clamp(10px,1.4vh,13px); letter-spacing:.09em; text-transform:uppercase; }
  .row.late .delay{ display:block; }
  .live{ flex:0 0 auto; width:clamp(12px,1.6vh,16px); height:clamp(12px,1.6vh,16px); border-radius:3px;
         background:var(--amber); display:grid; place-items:center; }
  .live::after{ content:""; width:38%; height:60%; border:2px solid #14161A; border-top:0; border-right:0; }
  .eta{ flex:0 0 auto; text-align:center; min-width:clamp(36px,5vw,44px); }
  .eta .n{ display:block; color:var(--amber); font-family:"Barlow Condensed",sans-serif; font-weight:700;
           font-size:clamp(22px,3.3vh,32px); line-height:.92; font-variant-numeric:tabular-nums; }
  .eta .u{ display:block; color:var(--amber); opacity:.8; font-family:"Barlow Condensed",sans-serif; font-weight:500;
           font-size:clamp(10px,1.3vh,13px); letter-spacing:.1em; text-transform:uppercase; }
  .row.arriving .eta .n{ font-size:clamp(15px,2.2vh,20px); letter-spacing:.08em; line-height:1.3; }
  .row.arriving .eta .u, .row.arriving .delay{ display:none; }
  .row.arriving .chip{ background:var(--amber); color:#101216; }

  /* ---- the two big buttons ---- */
  .actions{ flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:clamp(6px,1.5vw,10px);
            padding:clamp(6px,1.1vh,10px) clamp(9px,2.4vw,14px); }
  .big{ font:inherit; color:#fff; text-align:left; cursor:pointer; border-radius:12px;
        padding:clamp(8px,1.3vh,13px) clamp(10px,2.4vw,14px); display:flex; gap:10px; align-items:center;
        border:1.5px solid #3A3F48; background:#15181D; transition:border-color .2s, background .2s; }
  .big:hover{ border-color:#5A606B; }
  .big.on{ border-color:var(--amber); background:#2A2210; }
  .big .ic{ flex:0 0 auto; width:clamp(30px,4.2vh,38px); height:clamp(30px,4.2vh,38px); border-radius:50%;
            display:grid; place-items:center; font-size:clamp(16px,2.3vh,20px); }
  .big.wait .ic{ background:rgba(242,178,51,.18); }
  .big.explore .ic{ background:rgba(168,116,216,.2); }
  .big .t{ font-weight:700; font-size:clamp(15px,2.1vh,19px); line-height:1.1; }
  .big .s{ font-size:clamp(11px,1.45vh,13px); color:#9AA2AD; margin-top:2px; }

  /* ---- real map ---- */
  .stage{ flex:1 1 auto; position:relative; min-height:0; margin:0 clamp(9px,2.4vw,14px) clamp(6px,1.1vh,10px);
          border-radius:10px; overflow:hidden; background:#1B1E24; transition:opacity .5s ease; }
  #map{ position:absolute; inset:0; background:#1B1E24; }
    .darkmap{ filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }
  .leaflet-container{ font-family:"Barlow",sans-serif; }
  .leaflet-control-attribution{ background:rgba(0,0,0,.55)!important; color:#8A919C!important; font-size:9px!important; }
  .leaflet-control-attribution a{ color:#AEB6C2!important; }
  .me{ width:18px; height:18px; border-radius:50%; background:#2E7DF0; border:3px solid #fff;
       box-shadow:0 0 0 10px rgba(76,147,240,.25); }
  .melbl{ color:#fff; font-weight:700; font-size:13px; white-space:nowrap; text-shadow:0 1px 3px #000,0 0 6px #000; }
  .lm{ display:inline-flex; align-items:center; gap:7px; padding:5px 10px 5px 6px; border-radius:9px; white-space:nowrap;
       background:rgba(17,21,28,.92); border:1.4px solid #5A6474; cursor:pointer; transition:opacity .3s; }
  .lm i{ width:14px; height:14px; border-radius:50%; border:2px solid #11151C; flex:0 0 auto; }
  .lm b{ font-size:13.5px; color:#fff; } .lm small{ font-size:11.5px; color:#AEB7C4; font-weight:600; }
  .lm.food i{ background:#F0A93C; } .lm.transit i{ background:#4C93F0; } .lm.park i{ background:#5AA469; }
  .lm.arts i{ background:#A874D8; } .lm.civic i{ background:#C3A469; }
  .lm.on{ background:#fff; border-color:#fff; } .lm.on b{ color:#15202C; } .lm.on small{ color:#4E5B68; }
  body.busy .lm:not(.on){ opacity:.12; pointer-events:none; }
  .pin{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; border:3px solid #fff;
        font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:18px; color:#11151C; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.6); transition:opacity .3s, transform .3s; }
  .pin.eat{ background:var(--eat); } .pin.shop{ background:var(--shop); } .pin.see{ background:var(--see); }
  .pin.dim{ opacity:.3; } .pin.on{ transform:scale(1.2); }

  /* ---- bottom card ---- */
  .card{ position:absolute; left:0; right:0; bottom:0; z-index:500; background:#fff; color:#1E2830;
         box-shadow:0 -8px 22px -14px rgba(0,0,0,.6); border-radius:14px 14px 0 0;
         padding:clamp(11px,1.8vh,16px) clamp(13px,3.4vw,18px) clamp(9px,1.4vh,13px);
         transform:translateY(103%); transition:transform .42s cubic-bezier(.2,.7,.3,1);
         display:flex; flex-direction:column; gap:clamp(6px,1vh,9px); max-height:78%; overflow:auto; }
  .card.up{ transform:translateY(0); }
  .kick{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:clamp(11px,1.5vh,13px);
         letter-spacing:.16em; text-transform:uppercase; color:#B7791F; display:flex; gap:8px; align-items:center; }
  .kick .ai{ background:#1E2830; color:#fff; border-radius:4px; padding:1px 6px; letter-spacing:.1em; }
  .kick .x{ margin-left:auto; font:inherit; border:0; background:#EEE9E0; color:#5B6570; border-radius:6px;
            padding:2px 8px; cursor:pointer; letter-spacing:.1em; }
  .note{ font-weight:600; font-size:clamp(15px,2.1vh,19px); color:#1E2830; line-height:1.25; }
  .note.wait{ color:#69737D; font-weight:500; }
  .list{ display:flex; flex-direction:column; gap:clamp(5px,.9vh,8px); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(6px,1vh,9px); }
  .opt{ display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; font:inherit; color:inherit;
        background:#F5F3EF; border:1.5px solid transparent; border-radius:10px; cursor:pointer;
        padding:clamp(7px,1.2vh,11px) 11px; }
  .opt:hover{ border-color:#D8D2C6; }
  .opt:disabled{ opacity:.45; cursor:default; }
  .opt .num{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
             font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:16px; color:#11151C; margin-top:1px; }
  .opt.eat .num{ background:var(--eat); } .opt.shop .num{ background:var(--shop); } .opt.see .num{ background:var(--see); }
  .opt .t{ font-weight:700; font-size:clamp(15px,2.1vh,19px); line-height:1.15; }
  .opt .m{ font-size:clamp(11.5px,1.5vh,13.5px); color:#69737D; margin-top:2px; }
  .opt .m .open{ color:#2F8A4C; font-weight:600; }
  .opt .p{ font-size:clamp(12.5px,1.7vh,15px); color:#33404B; margin-top:3px; }
  .cat{ flex-direction:column; gap:4px; align-items:flex-start; padding:clamp(10px,1.6vh,14px) 12px; }
  .cat .e{ font-size:clamp(22px,3vh,28px); line-height:1; }
  .busbtn .chip{ color:#fff; }
  .busbtn .eta2{ margin-left:auto; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:22px; color:#B7791F; }
  .skel{ height:clamp(52px,7vh,64px); border-radius:10px; background:linear-gradient(90deg,#F1EEE8,#E6E1D8,#F1EEE8);
         background-size:200% 100%; animation:sk 1.2s linear infinite; }
  @keyframes sk{ to{ background-position:-200% 0; } }
  .name{ font-weight:700; font-size:clamp(20px,2.9vh,27px); line-height:1.1; }
  .hrs{ font-size:clamp(12.5px,1.7vh,15px); font-weight:600; color:#2F8A4C; }
  .hrs.unk{ color:#8A939C; }
  .steps{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-weight:600;
          font-size:clamp(12.5px,1.7vh,15px); color:#33404B; }
  .steps b{ background:#EEF3FB; color:#1B5FBF; border-radius:5px; padding:2px 7px; }
  .back{ display:flex; align-items:baseline; gap:10px; background:#1E2830; color:#fff; border-radius:10px;
         padding:clamp(8px,1.3vh,12px) 14px; }
  .back .l{ font-family:"Barlow Condensed",sans-serif; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
            font-size:clamp(12px,1.6vh,14px); color:#F2B233; white-space:nowrap; }
  .back .v{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:clamp(30px,4.6vh,42px);
            line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .back .s{ margin-left:auto; font-size:clamp(11px,1.4vh,13px); color:#AEB7C4; text-align:right; }
  .src{ font-size:clamp(10px,1.3vh,12px); color:#8A939C; }
  .bar{ height:3px; background:#E6E9ED; border-radius:2px; overflow:hidden; flex:0 0 auto; }
  .bar i{ display:block; height:100%; background:var(--amber); width:100%; transform-origin:left; }

  .foot{ flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px;
         padding:0 clamp(12px,3vw,18px) clamp(7px,1.2vh,12px); font-family:"Barlow Condensed",sans-serif;
         letter-spacing:.14em; text-transform:uppercase; font-size:clamp(9.5px,1.3vh,12px); color:#5A6069; }
  body.arriving .stage, body.arriving .actions{ opacity:.16; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>

<div id="unit">
  <div class="sign">
    <svg class="bus" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="4" y="3" width="16" height="14" rx="3" fill="#fff"/>
      <rect x="6.2" y="5.4" width="11.6" height="5" rx="1" fill="#2A2D63"/>
      <circle cx="8" cy="13.4" r="1.4" fill="#2A2D63"/><circle cx="16" cy="13.4" r="1.4" fill="#2A2D63"/>
      <rect x="6" y="17" width="3" height="3.4" rx="1" fill="#fff"/><rect x="15" y="17" width="3" height="3.4" rx="1" fill="#fff"/>
    </svg>
    <div class="routes">9<span>|</span>12<span>|</span>21<span>|</span>42</div>
    <div class="id"><span class="lv" id="lv">&#9675; connecting</span><br>Stop I.D. 14885</div>
  </div>

  <div class="arrivals" id="arrivals"></div>

  <div class="actions">
    <button class="big wait" id="bWait"><span class="ic">&#9201;</span>
      <span><div class="t">Long wait?</div><div class="s">Find something that fits</div></span></button>
    <button class="big explore" id="bExplore"><span class="ic">&#10024;</span>
      <span><div class="t">Explore nearby</div><div class="s">Food &middot; sights &middot; shops</div></span></button>
  </div>

  <div class="stage" id="stage">
    <div id="map" aria-label="Map centred on 11th &amp; Walnut St"></div>
    <div class="card" id="card" aria-live="polite"></div>
  </div>

  <div class="foot">
    <span id="hint">Tap a button, your bus, or a place</span>
    <span>Prototype &middot; UPenn course &middot; not affiliated with SEPTA</span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i);};
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function clock(ms){ return new Date(Date.now()+ms).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }

  var STOP=[39.948704,-75.15883], BUFFER=2;
  var ROUTES=[
    {id:"9", dest:"Andorra"}, {id:"12", dest:"50th-Woodland"},
    {id:"21", dest:"69th St Transit Center"}, {id:"42", dest:"Wycombe"}];
  var SEED={"9":16,"12":9,"21":12,"42":7};
  // Landmarks from prototype A - tap for a real walking route.
  var PLACES=[
    {nm:"Midtown Village", cat:"food", walk:4, ll:[39.9497,-75.1619]},
    {nm:"Jefferson Station", cat:"transit", walk:5, ll:[39.9522,-75.1580]},
    {nm:"Reading Terminal", cat:"food", walk:8, ll:[39.9533,-75.1590], right:true},
    {nm:"Washington Square", cat:"park", walk:7, ll:[39.9466,-75.1524]},
    {nm:"City Hall", cat:"civic", walk:10, ll:[39.9524,-75.1636], bus:{route:"21",stops:3,off:"Broad & Walnut"}},
    {nm:"Kimmel Center", cat:"arts", walk:9, ll:[39.9467,-75.1655], bus:{route:"21",stops:3,off:"Broad & Walnut"}}];
  var CATS=[
    {id:"food", e:"&#127869;", t:"Restaurants", s:"Eat & drink"},
    {id:"sights", e:"&#127963;", t:"Sights", s:"Landmarks & culture"},
    {id:"gems", e:"&#11088;", t:"Local gems", s:"Only-in-Philly spots"},
    {id:"shops", e:"&#128717;", t:"Shops", s:"Browse & buy"}];
  var KIND={eat:"Eat", shop:"Browse", see:"See"};

  // ---------------------------------------------------------------- arrivals
  var eta={}, tracked={}, fake=false, arriving=null, live=false, demoSpeed=false, tickHandle=null;
  var POLL_MS=20000, DEMO_MIN_MS=2000, REAL_MIN_MS=60000, ARRIVE_MS=6000;
  $("arrivals").innerHTML=ROUTES.map(function(r){
    return '<div class="row" id="r'+r.id+'" role="button" tabindex="0"><div class="chip">'+r.id+'</div>'+
      '<div class="dest">'+r.dest+'</div><div class="delay">Delayed</div><div class="live"></div>'+
      '<div class="eta"><span class="n">'+SEED[r.id]+'</span><span class="u">min</span></div></div>';
  }).join("");
  ROUTES.forEach(function(r){ eta[r.id]=SEED[r.id]; tracked[r.id]=true; });

  function setEta(r,n){ $("r"+r).querySelector(".eta .n").textContent=n; }
  function setDelay(r,on,mins){
    var row=$("r"+r); row.classList.toggle("late",!!on);
    if(on) row.querySelector(".delay").textContent="Delayed "+(typeof mins==="number"?mins:"?")+" min";
  }
  function lateOf(r){ var row=$("r"+r); if(!row.classList.contains("late")) return 0;
    return parseInt((row.querySelector(".delay").textContent.match(/\d+/)||[0])[0],10)||0; }
  function tick(){
    if(arriving) return;
    ROUTES.forEach(function(x){ var r=x.id;
      if(!tracked[r]) return;
      eta[r]--; if(eta[r]<=0) startArriving(r); else setEta(r,eta[r]); });
  }
  function restartTick(){ clearInterval(tickHandle); tickHandle=setInterval(tick,(live&&!demoSpeed)?REAL_MIN_MS:DEMO_MIN_MS); }
  function setLive(on,label){ live=on; $("lv").className="lv"+(on?" on":"");
    $("lv").innerHTML=on?"● LIVE":"○ "+(label||"OFFLINE"); }
  function poll(){
    fetch("/api/septa",{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        (d.arrivals||[]).forEach(function(a){
          var row=$("r"+a.route); if(!row) return;
          if(a.destination) row.querySelector(".dest").textContent=a.destination;
          setDelay(a.route, a.delayed && typeof a.minutes==="number", a.late);
          if(typeof a.minutes==="number"){
            eta[a.route]=Math.max(1,a.minutes); tracked[a.route]=true;
            if(!arriving){ if(a.minutes<=1) startArriving(a.route); else setEta(a.route,eta[a.route]); }
          } else if(!fake){ tracked[a.route]=false; if(!arriving) setEta(a.route,"--"); }
        });
        setLive(true);
      })
      .catch(function(){ setLive(false,"DEMO DATA"); })
      .then(function(){ restartTick(); setTimeout(poll,POLL_MS); });
  }
  function startArriving(r){
    arriving=r; reset(true);
    var row=$("r"+r); row.classList.add("arriving"); row.querySelector(".eta .n").textContent="NOW";
    document.body.classList.add("arriving");
    setTimeout(function(){
      row.classList.remove("arriving"); document.body.classList.remove("arriving");
      eta[r]=Math.max(4,SEED[r]+Math.floor(Math.random()*5)-2); setEta(r,eta[r]); arriving=null;
    },ARRIVE_MS);
  }

  // ---------------------------------------------------------------- map
  var map=L.map("map",{zoomControl:false,attributionControl:true,scrollWheelZoom:false,
                       doubleClickZoom:false,boxZoom:false,keyboard:false}).setView(STOP,16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, className:"darkmap",
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  L.marker(STOP,{interactive:false,icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
  L.marker(STOP,{interactive:false,icon:L.divIcon({className:"",html:'<div class="melbl">You are here</div>',iconSize:[90,16],iconAnchor:[45,-14]})}).addTo(map);

  var lmMarkers=PLACES.map(function(p,i){
    var html='<div class="lm '+p.cat+'" data-i="'+i+'"><i></i><span><b>'+esc(p.nm)+'</b><br><small>'+p.walk+' min walk</small></span></div>';
    var m=L.marker(p.ll,{icon:L.divIcon({className:"",html:html,iconSize:null,iconAnchor:p.right?[0,18]:[0,18]})}).addTo(map);
    m.on("click",function(){ pickLandmark(i); });
    return m;
  });
  var layer=L.layerGroup().addTo(map), routeLine=null;
  function clearLayer(){ layer.clearLayers(); routeLine=null; }
  function cardPad(){ return [16, Math.min($("stage").clientHeight*0.8, $("card").offsetHeight)+16]; }
  function frame(latlngs){
    var b=L.latLngBounds(latlngs.concat([STOP]));
    map.fitBounds(b,{paddingTopLeft:[40,40],paddingBottomRight:[40,cardPad()[1]],maxZoom:17,animate:true});
  }
  function drawRoute(path, dest){
    if(routeLine) layer.removeLayer(routeLine);
    var pts=(path&&path.length>1)?path:[STOP,[STOP[0],dest[1]],dest];
    routeLine=L.layerGroup([
      L.polyline(pts,{color:"#16407A",weight:11,opacity:.9,lineCap:"round",lineJoin:"round"}),
      L.polyline(pts,{color:"#F2B233",weight:6,opacity:1,lineCap:"round",lineJoin:"round"})]).addTo(layer);
    frame(pts);
  }
  function resetView(){ map.setView(STOP,16,{animate:true}); }
  window.addEventListener("resize",function(){ map.invalidateSize(); });
  setTimeout(function(){ map.invalidateSize(); },300);

  // ---------------------------------------------------------------- card
  var card=$("card"), state=null, timer=null, seq=0;
  function show(html, ms){
    card.innerHTML=html+'<div class="bar"><i id="bar"></i></div>';
    card.classList.add("up"); document.body.classList.add("busy"); $("hint").style.opacity="0";
    var bar=$("bar"); bar.style.transition="none"; bar.style.transform="scaleX(1)"; void bar.offsetWidth;
    bar.style.transition="transform "+ms+"ms linear"; bar.style.transform="scaleX(0)";
    clearTimeout(timer); timer=setTimeout(function(){ reset(false); },ms);
    var x=card.querySelector(".x"); if(x) x.onclick=function(e){ e.stopPropagation(); reset(false); };
  }
  function kick(txt, ai){ return '<div class="kick"><span>'+txt+'</span>'+(ai?'<span class="ai">AI</span>':'')+'<button class="x">Close</button></div>'; }
  function reset(instant){
    seq++; clearTimeout(timer); state=null;
    card.classList.remove("up"); clearLayer();
    document.body.classList.remove("busy");
    document.querySelectorAll(".row").forEach(function(r){ r.classList.remove("sel"); });
    document.querySelectorAll(".big").forEach(function(b){ b.classList.remove("on"); });
    document.querySelectorAll(".lm").forEach(function(b){ b.classList.remove("on"); });
    $("hint").style.opacity=""; resetView();
  }
  function loading(title, msg){
    show(kick(title,true)+'<div class="note wait">'+msg+'</div><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>', 30000);
  }

  // ---- Long wait? -> pick your bus
  function pickBus(){
    if(arriving) return;
    reset(true); $("bWait").classList.add("on");
    var any=false;
    var btns=ROUTES.map(function(r){
      var ok=tracked[r.id] && typeof eta[r.id]==="number"; if(ok) any=true;
      return '<button class="opt busbtn" data-r="'+r.id+'"'+(ok?'':' disabled')+'><span class="chip" style="background:#4A5058">'+r.id+'</span>'+
        '<span class="t" style="align-self:center">'+esc($("r"+r.id).querySelector(".dest").textContent)+'</span>'+
        '<span class="eta2">'+(ok?eta[r.id]+" min":"--")+'</span></button>';
    }).join("");
    show(kick("Long wait?",false)+'<div class="note">'+(any?"Which bus are you waiting for?":"No buses are being tracked right now.")+'</div><div class="list">'+btns+'</div>', 20000);
    card.querySelectorAll(".busbtn").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); quest(b.getAttribute("data-r")); }; });
  }

  // ---- Explore nearby -> pick a category
  function pickCat(){
    if(arriving) return;
    reset(true); $("bExplore").classList.add("on");
    var btns=CATS.map(function(c){
      return '<button class="opt cat" data-c="'+c.id+'"><span class="e">'+c.e+'</span><span class="t">'+c.t+'</span><span class="m">'+c.s+'</span></button>';
    }).join("");
    show(kick("Explore nearby",false)+'<div class="note">What are you in the mood for?</div><div class="grid">'+btns+'</div>', 20000);
    card.querySelectorAll(".cat").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); explore(b.getAttribute("data-c")); }; });
  }

  // ---- AI calls
  function quest(r){
    if(arriving || !tracked[r] || typeof eta[r]!=="number") return;
    reset(true); var my=++seq;
    $("bWait").classList.add("on"); $("r"+r).classList.add("sel"); document.body.classList.add("busy");
    state={mode:"wait", route:r, minutes:eta[r], options:[]};
    loading("Waiting for the "+r, "Checking the "+r+"'s live position, what's open, and the weather…");
    get("/api/quest?mode=wait&route="+r+"&minutes="+eta[r]+"&late="+lateOf(r), my);
  }
  function explore(c){
    reset(true); var my=++seq;
    $("bExplore").classList.add("on"); document.body.classList.add("busy");
    var cat=CATS.filter(function(x){return x.id===c;})[0];
    state={mode:"explore", cat:c, catName:cat.t, options:[]};
    loading(cat.t+" nearby", "Checking what's open around 11th & Walnut…");
    get("/api/quest?mode=explore&cat="+c, my);
  }
  function get(url,my){
    fetch(url,{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){ return {error:"offline", options:[]}; })
      .then(function(d){ if(my===seq && state) options(d); });
  }

  function options(d){
    var title = state.mode==="wait" ? "Waiting for the "+state.route : state.catName+" nearby";
    state.options=d.options||[];
    var src='<div class="src">'+(d.ai?"Picked by AI":"AI offline · closest open places")+
      ' · places, hours & routes: TomTom'+(state.mode==="wait"?" · bus times are estimates":"")+'</div>';
    if(d.error && !state.options.length){
      show(kick(title,false)+'<div class="note">Can’t reach the recommendation service right now.</div>',8000); return;
    }
    if(!state.options.length){
      show(kick(title,d.ai)+'<div class="note">'+esc(d.note||"Nothing fits right now.")+'</div>'+src, 9000); return;
    }
    var html=state.options.map(function(o,i){
      var line = state.mode==="wait"
        ? KIND[o.kind]+' · '+o.walk+' min walk · '+o.dwell+' min there'
        : o.walk+' min walk · '+esc(o.category);
      return '<button class="opt '+o.kind+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+
        '<div class="t">'+esc(o.name)+'</div><div class="m">'+line+' · <span class="'+(o.open?'open':'')+'">'+esc(o.hours)+'</span></div>'+
        (o.pitch?'<div class="p">'+esc(o.pitch)+'</div>':'')+'</span></button>';
    }).join("");
    show(kick(title,d.ai)+'<div class="note">'+esc(d.note||"Three picks for you:")+'</div><div class="list">'+html+'</div>'+src, 30000);
    card.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); choose(+b.getAttribute("data-i")); }; });

    clearLayer();
    state.pins=state.options.map(function(o,i){
      var m=L.marker([o.lat,o.lon],{icon:L.divIcon({className:"",html:'<div class="pin '+o.kind+'">'+(i+1)+'</div>',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(layer);
      m.on("click",function(){ choose(i); }); return m;
    });
    setTimeout(function(){ frame(state.options.map(function(o){return [o.lat,o.lon];})); },60);
  }

  function choose(i){
    var o=state && state.options[i]; if(!o) return;
    (state.pins||[]).forEach(function(m,j){ var el=m.getElement(); if(el){ var p=el.querySelector(".pin");
      p.classList.toggle("on",j===i); p.classList.toggle("dim",j!==i); } });
    var hrs='<div class="hrs'+(o.open?'':' unk')+'">'+esc(o.hours)+'</div>';
    var body;
    if(state.mode==="wait"){
      var left=eta[state.route];
      body='<div class="name">'+esc(o.name)+'</div>'+hrs+
        '<div class="steps"><b>Walk '+o.walk+' min</b>→<b>'+o.dwell+' min there</b>→<b>Walk '+o.walk+' min</b></div>'+
        '<div class="back"><span class="l">Back by</span><span class="v">'+clock((left-BUFFER)*60000)+'</span>'+
        '<span class="s">Bus '+state.route+' due ~'+clock(left*60000)+'<br>we leave you '+BUFFER+' min spare</span></div>';
    } else {
      body='<div class="name">'+esc(o.name)+'</div>'+hrs+
        '<div class="steps"><b>Walk '+o.walk+' min</b><span>from this stop</span></div>';
    }
    show(kick(state.mode==="wait"?"Side quest":"Explore",true)+(o.pitch?'<div class="note">'+esc(o.pitch)+'</div>':'')+body+
      '<div class="src">Route: TomTom · map: OpenStreetMap / CARTO</div>', 25000);
    setTimeout(function(){ drawRoute(o.path,[o.lat,o.lon]); },60);
  }

  // ---- landmarks from prototype A: tap for a real walking route
  function pickLandmark(i){
    if(arriving) return;
    var p=PLACES[i]; reset(true); var my=++seq;
    state={mode:"landmark"};
    document.querySelectorAll(".lm").forEach(function(el){ el.classList.toggle("on",+el.getAttribute("data-i")===i); });
    var busLine = p.bus ? '<div class="steps"><b>Bus '+p.bus.route+' · '+p.bus.stops+' stops</b><span>boards here in '+eta[p.bus.route]+' min · off at '+p.bus.off+'</span></div>' : '';
    function render(walk){
      show(kick("To "+esc(p.nm),false)+'<div class="steps"><b>Walk '+walk+' min</b><span>from this stop</span></div>'+busLine+
        '<div class="src">Route: TomTom · map: OpenStreetMap / CARTO</div>',15000);
    }
    render(p.walk);
    fetch("/api/quest?mode=route&lat="+p.ll[0]+"&lon="+p.ll[1]).then(function(r){return r.json();})
      .catch(function(){ return {walk:p.walk, path:null}; })
      .then(function(d){ if(my!==seq) return; render(d.walk||p.walk); drawRoute(d.path,p.ll); });
  }

  // ---------------------------------------------------------------- wiring
  $("bWait").onclick=function(){ pickBus(); };
  $("bExplore").onclick=function(){ pickCat(); };
  ROUTES.forEach(function(r){
    var row=$("r"+r.id);
    row.addEventListener("click",function(){ quest(r.id); });
    row.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); quest(r.id); } });
  });
  map.on("click",function(){ if(state) reset(false); });

  restartTick(); poll();

  // Recording helpers, invisible on screen:
  //   b = force the next 21 to arrive now      d = toggle demo speed
  //   l = toggle the Delay pill on route 42    r = reset
  //   f = fake buses (use at night when SEPTA isn't tracking anything)
  document.addEventListener("keydown",function(e){
    if(e.key==="b" && !arriving) startArriving("21");
    if(e.key==="d"){ demoSpeed=!demoSpeed; restartTick(); }
    if(e.key==="l"){ setDelay("42", !$("r42").classList.contains("late"), 6); }
    if(e.key==="f"){ fake=true; ROUTES.forEach(function(r){ tracked[r.id]=true; eta[r.id]=SEED[r.id]+4; setEta(r.id,eta[r.id]); }); }
    if(e.key==="r"){ reset(true); ROUTES.forEach(function(r){ eta[r.id]=SEED[r.id]; setEta(r.id,SEED[r.id]); setDelay(r.id,false); }); }
  });
})();
</script>
